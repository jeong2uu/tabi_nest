server:
  port: 8888

  # Login session timeout (30 minutes)
  servlet:
    session:
      timeout: 30m
logging:
  level:
    org.springframework.security: DEBUG

spring:
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
  application:
    name: tabi_nest
  config:  # .env import
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:mariadb://localhost:3306/tabi_nest
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

    # Page Reload
    devtools:
      livereload:
        enabled: true
      remote:
        restart:
          enabled: true

  # ===== OAuth2 Login (Google / Naver / Kakao) =====
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope: profile, email
          naver:
            client-id: ${NAVER_CLIENT_ID:}
            client-secret: ${NAVER_CLIENT_SECRET:}
            client-name: Naver
            authorization-grant-type: authorization_code
            redirect-uri: "http://localhost:8888/login/oauth2/code/naver"
            scope: name, email
          kakao:
            client-name: Kakao
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET:}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-authentication-method: client_secret_post
            scope:
              - profile_nickname
              - account_email
        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

# ===== JWT =====
# 실제 비밀키는 .env 주입하세요. (Git에 올리지 않기)
jwt:
  secret: ${JWT_SECRET}
  # Access Token 만료(분) - 필요시 조정
  access-exp-minutes: ${JWT_ACCESS_EXP_MINUTES:30}
  # HttpOnly 쿠키 이름 (프론트 JS가 직접 접근하지 못하게 함)
  cookie-name: ${JWT_COOKIE_NAME:TB_ACCESS}