server:
  port: 8888

  # Login session timeout (30 minutes)
  servlet:
    session:
      timeout: 30m

spring:
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
  application:
    name: tabi_nest

  datasource:
    url: jdbc:mariadb://localhost:3306/tabi_nest
    username: yujeong
    password: 0825
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

    # Page Reload
    devtools:
      livereload:
        enabled: true
      remote:
        restart:
          enabled: true
