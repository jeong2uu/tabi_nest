<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title data-i18n="auth.login.title">로그인</title>
  <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div th:replace="~{/common/navbar :: navbar}"></div>

<main class="container section">
  <div class="auth-card">
    <h1 class="auth-title" data-i18n="auth.login.title">로그인</h1>
    <p class="auth-subtitle" data-i18n="auth.login.subtitle">Tabi Nest에 오신 것을 환영합니다.</p>
    <p class="auth-subtitle" data-i18n="auth.modal.hint">상단 버튼이 보이지 않는 환경을 위해 모달을 자동으로 띄웁니다.</p>
  </div>
</main>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    if (window.bootstrap) {
      const el = document.getElementById('loginModal');
      if (el) new window.bootstrap.Modal(el).show();
    }
  });
</script>
</body>
</html>
