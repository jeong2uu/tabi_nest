<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:fragment="authModals">

  <!-- Login Modal -->
  <div class="modal fade" id="loginModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content auth-modal">
        <div class="modal-header">
          <h5 class="modal-title" data-i18n="auth.login.title">로그인</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <p class="auth-help" data-i18n="auth.login.subtitle">Tabi Nest에 오신 것을 환영합니다.</p>

          <form id="loginForm" class="auth-form">
            <label class="auth-label" for="loginEmail" data-i18n="auth.email">이메일</label>
            <input class="auth-input" id="loginEmail" name="email" type="email" autocomplete="email" required />

            <label class="auth-label" for="loginPassword" data-i18n="auth.password">비밀번호</label>
            <input class="auth-input" id="loginPassword" name="password" type="password" autocomplete="current-password" required />

            <div class="auth-error" id="loginError" role="alert" hidden></div>

            <button class="auth-btn" type="submit" data-i18n="auth.login.button">로그인</button>
          </form>

          <!-- OAuth 로그인: Spring Security 표준 엔드포인트로 이동 (리다이렉트 인증 플로우) -->
          <div class="auth-divider">
            <span data-i18n="auth.oauth.or">또는</span>
          </div>

          <div class="oauth-grid">
            <a class="oauth-btn oauth-btn--kakao" th:href="@{/oauth2/authorization/kakao}">
              <span class="oauth-ic" aria-hidden="true">💬</span>
              <span data-i18n="auth.oauth.kakao">카카오로 계속</span>
            </a>
            <a class="oauth-btn oauth-btn--naver" th:href="@{/oauth2/authorization/naver}">
              <span class="oauth-ic" aria-hidden="true">N</span>
              <span data-i18n="auth.oauth.naver">네이버로 계속</span>
            </a>
            <a class="oauth-btn oauth-btn--google" th:href="@{/oauth2/authorization/google}">
              <span class="oauth-ic" aria-hidden="true">G</span>
              <span data-i18n="auth.oauth.google">구글로 계속</span>
            </a>
          </div>

          <div class="auth-footer">
            <span data-i18n="auth.login.noAccount">계정이 없으신가요?</span>
            <button type="button" class="auth-link-btn" data-bs-target="#signupModal" data-bs-toggle="modal" data-i18n="auth.signup.link">회원가입</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Signup Modal -->
  <div class="modal fade" id="signupModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content auth-modal">
        <div class="modal-header">
          <h5 class="modal-title" data-i18n="auth.signup.title">회원가입</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <p class="auth-help" data-i18n="auth.signup.subtitle">몇 분이면 끝나요.</p>

          <form id="signupForm" class="auth-form">
            <label class="auth-label" for="signupName" data-i18n="auth.name">이름</label>
            <input class="auth-input" id="signupName" name="name" type="text" autocomplete="name" required />

            <label class="auth-label" for="signupEmail" data-i18n="auth.email">이메일</label>
            <input class="auth-input" id="signupEmail" name="email" type="email" autocomplete="email" required />

            <label class="auth-label" for="signupPhone" data-i18n="auth.phone">전화번호</label>
            <input class="auth-input" id="signupPhone" name="phone" type="tel" autocomplete="tel" />

            <label class="auth-label" for="signupPassword" data-i18n="auth.password">비밀번호</label>
            <input class="auth-input" id="signupPassword" name="password" type="password" autocomplete="new-password" required />

            <div class="auth-error" id="signupError" role="alert" hidden></div>

            <button class="auth-btn" type="submit" data-i18n="auth.signup.button">회원가입</button>
          </form>

          <div class="auth-footer">
            <span data-i18n="auth.signup.haveAccount">이미 계정이 있으신가요?</span>
            <button type="button" class="auth-link-btn" data-bs-target="#loginModal" data-bs-toggle="modal" data-i18n="auth.login.link">로그인</button>
          </div>
        </div>
      </div>
    </div>
  </div>

</div>
</html>
