<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tabi Nest</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <style>
        html, body { height: 100%; margin: 0; font-family: 'Pretendard', sans-serif; }
        .intro-container { position: relative; width: 100%; height: 100vh; overflow: hidden; }

        /* 슬라이드 배경 */
        .intro-slide { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-size: cover; background-position: center; opacity: 0; transition: opacity 1.5s ease-in-out; }
        .intro-slide.active { opacity: 1; }

        /* 어두운 오버레이 */
        .intro-overlay { position: absolute; inset: 0; background: rgba(0, 0, 0, 0.45); z-index: 1; }

        /* 콘텐츠 */
        .intro-content { position: relative; z-index: 2; top: 40%; transform: translateY(-50%); color: #fff; animation: fadeUp 1.8s ease forwards; }

        /* 텍스트 */
        .intro-title { font-size: 48px; font-weight: 700; margin-bottom: 20px; }
        .intro-sub { font-size: 18px; font-weight: 300; line-height: 1.6; margin-bottom: 40px; }

        /* 버튼 */
        .intro-buttons { display: flex; gap: 20px; justify-content: center; }
        .intro-buttons .btn { min-width: 180px; }

        /* 애니메이션 */
        @keyframes fadeUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

        /* 모바일 */
        @media (max-width: 768px) {
            .intro-title { font-size: 32px; }
            .intro-sub { font-size: 15px; }
            .intro-buttons { flex-direction: column; }
        }
    </style>
</head>
<body>

<section class="intro-container">

    <!-- Background Slider -->
    <div class="intro-slide"
         th:each="banner, stat : ${banners}"
         th:classappend="${stat.index == 0} ? ' active'"
         th:style="|background-image: url('@{${banner}}');|">
    </div>
    <!-- Overlay -->
    <div class="intro-overlay"></div>

    <!-- Content -->
    <div class="intro-content text-center">
        <h2 class="intro-title">
            여행의 하루를 쉬어가는 <br>
            가장 좋은 방법
        </h2>

        <h4 class="intro-sub">
            일본 전역의 엄선된 숙소를 한 곳에서<br>
            당신의 여행에 꼭 맞는 보금자리를 찾아보세요
        </h4>

        <!-- Buttons -->
        <div class="intro-buttons">
            <a th:href="@{/home}" class="btn btn-light btn-lg"> 일반 사용자 </a>
            <a th:href="@{/host}" class="btn btn-outline-light btn-lg"> 숙소 등록 </a>

        </div>
    </div>

</section>

<!-- JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const slides = document.querySelectorAll('.intro-slide');
    let current = 0;

    setInterval(() => {
        slides[current].classList.remove('active');
        current = (current + 1) % slides.length;
        slides[current].classList.add('active');
    }, 6000); // 6초
</script>

</body>
</html>
